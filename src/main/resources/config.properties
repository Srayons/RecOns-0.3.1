# 腾讯云语音识别配置 - 请替换为您自己的密钥
# 获取地址：https://console.cloud.tencent.com/cam/capi
tencent.app.id=YOUR_APP_ID
tencent.secret.id=YOUR_SECRET_ID
tencent.secret.key=YOUR_SECRET_KEY

# 语音识别引擎类型
# 16k_zh: 中文普通话 16k_en: 英语 16k_yue: 粤语 16k_ja: 日语 16k_ko: 韩语
asr.engine.type=16k_zh

# 录屏配置
recorder.video.fps=30
recorder.video.bitrate=4000000
recorder.audio.sample.rate=16000
recorder.audio.channels=1

# 字幕配置
subtitle.font.size=24
subtitle.font.family=Microsoft YaHei
subtitle.color=white
subtitle.background.color=rgba(0,0,0,0.6)
subtitle.position=bottom
subtitle.show.in.realtime=true
subtitle.burn.into.video=false

# 输出配置
output.directory=./recordings
